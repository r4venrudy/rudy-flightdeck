<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Rudy Flightdeck</title>
  <desc id="desc">Offline JVM recording investigations. Execution samples, wait edges, resource evidence. Java 21. Developer preview.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#243448" stroke-width="1"/></pattern><linearGradient id="fade"><stop stop-color="#0a1018" stop-opacity="0"/><stop offset="1" stop-color="#0a1018"/></linearGradient></defs>
  <rect width="1400" height="420" rx="22" fill="#0a1018"/>
  <rect x="5" y="20" width="6" height="380" fill="#55e0b6"/>
  <rect x="820" y="20" width="550" height="320" fill="url(#grid)" opacity=".5"/>
  <text x="55" y="69" fill="#55e0b6" font-family="monospace" font-size="18" letter-spacing="3">RUDY SYSTEMS / JVM OBSERVABILITY</text>
  <text x="53" y="158" fill="#edf4fc" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">Rudy Flightdeck</text>
  <text x="56" y="218" fill="#97acc1" font-family="Arial,sans-serif" font-size="28">Turn recordings into evidence you can follow.</text>
  <text x="56" y="264" fill="#97acc1" font-family="Arial,sans-serif" font-size="22">Execution samples. Wait edges. Resource evidence.</text>
  <g fill="#101b28" stroke="#2e465a"><rect x="975" y="82" width="350" height="45" rx="6"/><rect x="975" y="144" width="240" height="45" rx="6"/><rect x="975" y="206" width="310" height="45" rx="6"/></g>
  <g fill="#55e0b6" font-family="monospace" font-size="15"><text x="996" y="111">TRUSTED JFR / LOCAL ANALYSIS</text><text x="996" y="173">SAMPLES + WAIT EDGES</text><text x="996" y="235">REVIEWABLE RECORDING EVIDENCE</text></g>
  <path d="M55 322H1340" stroke="#243448"/>
  <text x="56" y="373" fill="#55e0b6" font-family="monospace" font-size="19">JAVA 21+ / STANDARD JDK / OFFLINE</text>
  <text x="1340" y="373" text-anchor="end" fill="#97acc1" font-family="monospace" font-size="17">DEVELOPER PREVIEW</text>
