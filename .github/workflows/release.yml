name: Release verified packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: java tools/Build.java package
      - name: Assemble portable distributions
        shell: bash
        run: |
          set -euo pipefail
          test "$(java -jar dist/rudy-flightdeck-0.1.0-preview.jar --version)" = "flightdeck ${GITHUB_REF_NAME#v}"
          root=build/rudy-flightdeck-0.1.0-preview
          mkdir -p "$root/lib"
          cp dist/rudy-flightdeck-0.1.0-preview.jar "$root/lib/"
          cp README.md LICENSE SECURITY.md CONTRIBUTING.md "$root/"
          cp -R docs examples assets bin "$root/"
          chmod +x "$root/bin/flightdeck"
          "$root/bin/flightdeck" --version
          (cd build && zip -qr ../dist/rudy-flightdeck-0.1.0-preview.zip rudy-flightdeck-0.1.0-preview)
          tar -czf dist/rudy-flightdeck-0.1.0-preview.tar.gz -C build rudy-flightdeck-0.1.0-preview
          (cd dist && sha256sum rudy-flightdeck-0.1.0-preview.jar rudy-flightdeck-0.1.0-preview.zip rudy-flightdeck-0.1.0-preview.tar.gz > SHA256SUMS.txt)
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Rudy Flightdeck $GITHUB_REF_NAME" --notes-file docs/RELEASE.md --prerelease
